[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mm-arena"
version = "0.2.0"
description = "Market-making games as a benchmark for LLM agents, scored exactly against a Bayes-optimal quoter."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "mm-arena contributors" }]
keywords = [
    "llm", "benchmark", "evaluation", "agents", "market-making", "market-microstructure",
    "adverse-selection", "glosten-milgrom", "bayesian", "quant",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
plot = ["matplotlib>=3.8"]
all = ["anthropic>=0.40", "openai>=1.50", "matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/h-a-forster/mm-arena"
Issues = "https://github.com/h-a-forster/mm-arena/issues"
Changelog = "https://github.com/h-a-forster/mm-arena/blob/main/CHANGELOG.md"

[project.scripts]
mm-arena = "mmarena.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/mmarena"]

[tool.hatch.build.targets.sdist]
include = ["src/mmarena", "tests", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
